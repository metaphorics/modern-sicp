# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy rustfmt
      - name: Install cargo-nextest
        run: cargo +1.98.1 install cargo-nextest --locked --version 0.9.146
      - name: Gates
        working-directory: rust
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
          cargo +1.98.1 nextest run --workspace
          cargo +1.98.1 test --doc --workspace

  ocaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.5.1"
          dune-cache: true
      - name: Install dependencies
        working-directory: ocaml
        run: opam install . --deps-only --with-test --with-dev-setup
      - name: Gates
        working-directory: ocaml
        run: |
          opam exec -- dune build @check
          opam exec -- dune runtest
          opam exec -- dune fmt --check 2>/dev/null || opam exec -- dune build @fmt

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Gates
        working-directory: typescript
        run: |
          pnpm exec biome check .
          pnpm exec tsc --noEmit
          pnpm vitest run

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Gates
        working-directory: kotlin
        run: ./gradlew ktlintCheck build

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Gates
        run: |
          uv run --project tools ruff check tools
          uv run --project tools ruff format --check tools
          uv run --project tools pyright tools
          uv run --project tools pytest tools/tests -q
          uv run --project tools python tools/scheme_corpus_check.py

  books-html-epub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic texlive-font-utils default-jre-headless curl unzip python3-pygments
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tgz
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  /tmp/just.tgz" | sha256sum -c -
          sudo tar xzf /tmp/just.tgz -C /usr/local/bin just
      - name: Install pinned book toolchain
        run: just setup-books
        env:
          MODERN_SICP_PREFIX: /tmp/msicp-opt
      - name: Build books (HTML + EPUB)
        run: |
          export MODERN_SICP_PREFIX=/tmp/msicp-opt
          export PATH="$MODERN_SICP_PREFIX/bin:$PATH"
          for lang in rust ocaml typescript kotlin; do
            just --justfile "$lang/justfile" --working-directory "$lang" book-html-epub
          done

  books-pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic texlive-font-utils default-jre-headless curl unzip python3-pygments
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tgz
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  /tmp/just.tgz" | sha256sum -c -
          sudo tar xzf /tmp/just.tgz -C /usr/local/bin just
      - name: Install pinned book toolchain
        run: just setup-books
        env:
          MODERN_SICP_PREFIX: /tmp/msicp-opt
      - name: Build books (PDF)
        run: |
          export MODERN_SICP_PREFIX=/tmp/msicp-opt
          export PATH="$MODERN_SICP_PREFIX/bin:$PATH"
          for lang in rust ocaml typescript kotlin; do
            just --justfile "$lang/justfile" --working-directory "$lang" book-pdf
          done

  site:
    runs-on: ubuntu-24.04
    needs: [books-html-epub]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic texlive-font-utils default-jre-headless curl unzip python3-pygments
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tgz
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  /tmp/just.tgz" | sha256sum -c -
          sudo tar xzf /tmp/just.tgz -C /usr/local/bin just
      - name: Install pinned book toolchain
        run: just setup-books
        env:
          MODERN_SICP_PREFIX: /tmp/msicp-opt
      - name: Build books for the site
        run: |
          export MODERN_SICP_PREFIX=/tmp/msicp-opt
          export PATH="$MODERN_SICP_PREFIX/bin:$PATH"
          for lang in rust ocaml typescript kotlin; do
            just --justfile "$lang/justfile" --working-directory "$lang" book
          done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html site/site.css _site/
          # Pages reference figures at /text/original/figures and fonts at
          # fonts/ relative to each page; stage both beside the editions.
          # Edition-rendered figures are referenced as figures/... relative
          # to each page, so they stage inside the edition directory.
          mkdir -p _site/text/original
          cp -r text/original/figures _site/text/original/figures
          for lang in rust ocaml typescript kotlin; do
            cp -r "$lang/book/_build/html" "_site/$lang"
            cp -r text/assets/css/fonts "_site/$lang/fonts"
            if [ -d "$lang/book/figures" ]; then
              cp -r "$lang/book/figures" "_site/$lang/figures"
            fi
            mkdir -p "_site/$lang/book/_build"
            cp "$lang/book/_build/$lang-sicp.epub" "_site/$lang/book/_build/"
            cp "$lang/book/_build/$lang-sicp.pdf" "_site/$lang/book/_build/" || true
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
